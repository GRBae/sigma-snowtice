<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snowtice · 숙명 공지 비서</title>
<link rel="icon" type="image/png" href="/web/favicon.png">
<style>
:root{--navy:#003087;--navy2:#0072ce;--ink:#111827;--sub:#5b6577;--mute:#9aa3b2;--line:#e5e8ef;--bg:#f5f7fb;--card:#fff;
  --blue-bg:#e6f0fb;--blue:#0062b8;--org-bg:#fff1df;--org:#b85c00;--gray-bg:#eef0f4;--pur-bg:#efe9fd;--pur:#6b3fd1;--yel-bg:#fff7dc;--yel:#e8b400;--red:#b42318;--green:#1f8a5b}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
a{color:inherit}
button{font:inherit;cursor:pointer}
/* 상단 */
.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;height:60px;display:flex;align-items:center;gap:22px;padding:0 20px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--navy);text-decoration:none}
.logo img{display:block}
.menu{display:flex;gap:4px;flex:1}
.menu a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--sub);font-weight:500}
.menu a.on{background:var(--blue-bg);color:var(--navy);font-weight:700}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue-bg);color:var(--navy);font-weight:800;border:0;display:grid;place-items:center}
.home .top{background:transparent;border-color:transparent}
.home .logo,.home .menu{visibility:hidden}
main{max-width:1180px;margin:0 auto;padding:26px 20px 60px}
h1.pg{font-size:26px;margin:4px 0 4px} .pg-sub{color:var(--sub);margin:0 0 18px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.space{flex:1}
.link{color:var(--navy);font-weight:600;text-decoration:none;font-size:13px}
/* 칩·배지 */
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;color:var(--sub)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.chip small{font-weight:500;opacity:.8;margin-left:3px}
.bd{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.bd-new{background:var(--blue-bg);color:var(--blue)} .bd-open{background:var(--org-bg);color:var(--org)} .bd-past{background:var(--gray-bg);color:var(--mute)}
.bd-wait{background:var(--gray-bg);color:var(--sub)} .bd-fit{background:var(--blue-bg);color:var(--blue)} .bd-chk{background:var(--pur-bg);color:var(--pur)} .bd-no{background:var(--gray-bg);color:var(--mute)}
.bd-ovr{background:var(--pur-bg);color:var(--pur)}
/* 카드 */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.pad{padding:18px 20px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600}
.btn-p{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-y{background:var(--yel-bg);border-color:#f0d27a;color:#6b4e00}
.empty{color:var(--mute);padding:20px 0;text-align:center}
.loading{color:var(--sub);padding:20px 0;text-align:center}
/* 홈 */
.hero{min-height:calc(100vh - 60px - 46px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}
.hero .big{display:flex;align-items:center;gap:14px;font-size:46px;font-weight:900;color:var(--navy)}
.hero .big i{display:grid;place-items:center;width:64px;height:64px;border-radius:16px;background:var(--navy);color:#fff;font-style:normal;font-size:36px}
.hero p{color:var(--sub);font-size:16px;margin:14px 0 26px}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:999px;padding:15px 28px;font-weight:800;font-size:16px;text-decoration:none;box-shadow:0 10px 24px rgba(0,48,135,.22)}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:16px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--sub);background:#fff}
.quick{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;justify-content:center}
.quick a{text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;color:var(--ink)}
.quick b{color:var(--navy)}
.flake{position:absolute;color:#9fb5ea;font-size:18px;user-select:none}
.foot{border-top:1px solid var(--line);background:#eef2fa;color:var(--sub);text-align:center;font-size:12px;padding:14px}
/* 설정 */
.set{display:grid;grid-template-columns:1fr 360px;gap:18px} @media(max-width:900px){.set{grid-template-columns:1fr}}
.sec h3{margin:0 0 12px;font-size:16px} .sec h3 small{color:var(--mute);font-weight:500;margin-left:6px}
.grp{margin:10px 0 4px;font-size:12px;color:var(--sub);font-weight:700}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px} @media(max-width:700px){.form{grid-template-columns:1fr}}
.form label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;font-weight:600}
.form select,.form input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.seg{display:flex;gap:6px}
.preview{background:#1b2130;color:#fff;border-radius:14px;padding:14px;display:flex;gap:10px}
.preview i{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:8px;background:#fff;font-style:normal}
.notebox{background:var(--blue-bg);color:var(--navy);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:12px}
.saved-toast{color:var(--green);font-weight:700;font-size:13px}
/* 공지함 */
.tabs{display:flex;gap:6px;margin:6px 0 14px}
.list{overflow:hidden}
.nrow{padding:14px 18px;border-top:1px solid var(--line);cursor:pointer}
.nrow:first-child{border-top:0} .nrow:hover{background:#fafbff} .nrow.sel{background:#f2f5ff;box-shadow:inset 3px 0 0 var(--navy)}
.nrow .meta{font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nrow .t{font-weight:700;font-size:15px;margin:5px 0 3px}
.nrow.past .t{color:var(--mute)}
.nrow .f{font-size:12.5px;color:var(--sub)}
.more{text-align:center;padding:12px}
.detail{margin-top:16px}
.dl{display:grid;grid-template-columns:96px 1fr;gap:9px 12px;margin:14px 0;font-size:13.5px}
.dl dt{color:var(--sub)} .dl dd{margin:0}
.stg{padding:9px 0;border-top:1px dashed var(--line)} .stg:first-child{border-top:0}
/* 그래프 */
.gtop{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.vtabs{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px}
.vtabs button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--sub)}
.vtabs button.on{background:var(--navy);color:#fff}
.gl{display:grid;grid-template-columns:250px 1fr;gap:16px;margin-top:14px;align-items:start} @media(max-width:900px){.gl{grid-template-columns:1fr}}
.side h4{font-size:12px;color:var(--sub);margin:14px 0 8px} .side h4:first-child{margin-top:0}
.side label{display:flex;gap:8px;align-items:center;margin:6px 0}
.lg{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12.5px;color:var(--sub)}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.ring{width:11px;height:11px;border-radius:50%;border:2px solid #8a93a3;display:inline-block}
#cy{height:560px}
.gcap{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);padding:10px 14px;border-bottom:1px solid var(--line)}
.gnote{font-size:12px;color:var(--sub);padding:10px 14px;border-top:1px solid var(--line)}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.zoom button{border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px}
.selcard{margin-top:16px;max-width:420px}
.selcard .dl{grid-template-columns:52px 1fr}
.path{background:var(--blue-bg);border-radius:10px;padding:10px 12px;font-size:13px;margin:12px 0}
.path b{display:block;color:var(--navy);font-size:12px;margin-bottom:4px}
.tl{padding:18px}
.tl-axis{position:relative;height:28px;border-bottom:1px solid var(--line);margin-left:150px}
.tl-axis span{position:absolute;font-size:11px;color:var(--sub);transform:translateX(-50%)}
.tl-row{display:flex;align-items:center;min-height:34px;border-bottom:1px dashed #eef0f4}
.tl-row .nm{width:150px;flex:none;font-size:12px;color:var(--sub);padding-right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-row .lane{position:relative;flex:1;height:34px}
.tl-bar{position:absolute;top:9px;height:16px;border-radius:6px;background:var(--navy2);opacity:.9;min-width:6px;cursor:pointer}
.tl-bar.closed{background:#c3c9d4} .tl-bar.dept{background:var(--green)} .tl-bar.tent{background:repeating-linear-gradient(45deg,var(--navy2),var(--navy2) 5px,#5d7ad0 5px,#5d7ad0 10px)}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:2}
/* 인기 */
.top2{display:grid;grid-template-columns:1fr 320px;gap:16px} @media(max-width:900px){.top2{grid-template-columns:1fr}}
.rk{display:grid;grid-template-columns:30px 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.rk:first-child{border-top:0}
.rk .n{width:28px;height:28px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800}
.rk .n.lo{background:var(--gray-bg);color:var(--sub)}
.bar{height:6px;border-radius:3px;background:var(--gray-bg);margin-top:8px;overflow:hidden} .bar i{display:block;height:100%;background:var(--navy2)}
.how li{margin:6px 0;color:var(--sub);font-size:13px}
/* 라이브러리 */
.lib{display:grid;grid-template-columns:1fr 340px;gap:16px} @media(max-width:900px){.lib{grid-template-columns:1fr}}
.lcard{display:grid;grid-template-columns:84px 1fr auto;gap:16px;padding:16px 18px;margin-bottom:12px}
.dbox{background:var(--org-bg);border-radius:12px;text-align:center;padding:10px 4px;height:max-content}
.dbox small{display:block;font-size:11px;color:var(--org)} .dbox b{font-size:20px;color:var(--org)}
.dbox.later{background:var(--blue-bg)} .dbox.later small,.dbox.later b{color:var(--navy)}
.dbox.done{background:var(--gray-bg)} .dbox.done small,.dbox.done b{color:var(--mute)}
.cal{padding:16px}
.cal-h{display:flex;align-items:center;justify-content:space-between;font-weight:800;margin-bottom:10px}
.cal-h button{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:4px;font-size:13px}
.cal-g .w{color:var(--sub);font-size:12px;padding:4px 0}
.cal-g .d{padding:6px 0 10px;border-radius:9px;position:relative}
.cal-g .d.today{outline:2px solid var(--navy);font-weight:800}
.cal-g .d .ds{position:absolute;left:0;right:0;bottom:3px;display:flex;justify-content:center;gap:2px}
.cal-g .d .ds i{width:5px;height:5px;border-radius:50%;background:var(--org)} .cal-g .d .ds i.m{background:var(--navy2)}
.ev{display:grid;grid-template-columns:12px 52px 1fr;gap:6px;font-size:12.5px;padding:6px 0;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="logo" href="#/"><img src="/web/logo.png" alt="snowtice" height="26"></a>
  <nav class="menu">
    <a href="#/notice" data-r="notice">공지함</a><a href="#/graph" data-r="graph">관심사 그래프</a>
    <a href="#/top" data-r="top">인기 게시글</a><a href="#/lib" data-r="lib">내 라이브러리</a>
  </nav>
  <button class="avatar" id="avatar" title="관심사·학적 설정" onclick="location.hash='#/settings'">설</button>
</div></header>
<div id="app"></div>

<script src="/web/vendor/cytoscape.min.js"></script>
<script>
// ── 설정 ─────────────────────────────────────────────
const SNOWCHAT_URL = "https://sookmyung.factchat.bot/";   // SNOWCHAT 공지비서 챗봇 공개 주소로 바꾸기
const TERM = "2026-2";                                    // 2027년 2월 졸업
const $ = (s, r = document) => r.querySelector(s);
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls = {get(k, d){try{const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v)}catch{return d}}, set(k, v){try{localStorage.setItem(k, JSON.stringify(v))}catch{}}};
const api = (p, q = {}) => fetch(p + "?" + new URLSearchParams(Object.entries(q).filter(([, v]) => v !== "" && v != null && v !== false)))
  .then(r => r.ok ? r.json() : Promise.reject("HTTP " + r.status));
let DEPTS = [];
const prof = () => ls.get("sigma.profile", {dept: "", st: "재학", yr: "", sem: "7~8학기", advisor: "", interests: ["grad"]});
const saved = () => ls.get("sigma.saved", []);
const toggleSave = id => { const s = new Set(saved()); s.has(id) ? s.delete(id) : s.add(id); ls.set("sigma.saved", [...s]); return s.has(id); };
const pq = () => { const p = prof(); return {dept: p.dept, enroll_status: p.st, admission_year: p.yr, advisor: p.advisor}; };
const today = () => new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Seoul"}));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const deptName = c => (DEPTS.find(d => d.code === c) || {}).name || c;

const BADGE = {"새소식":"bd-new","신청 가능":"bd-open","지난 일정":"bd-past","정리 대기":"bd-wait"};
const badges = n => n.badges.map(b => `<span class="bd ${BADGE[b]}">${b === "신청 가능" ? "진행·예정" : b}</span>`).join(" ");
const fitBd = f => f ? `<span class="bd ${f === "해당" ? "bd-fit" : f === "확인 필요" ? "bd-chk" : "bd-no"}">${f}</span>` : "";
const per = s => esc(s).replace("[확인 필요]", '<span class="bd bd-chk">확인 필요</span>');
function facts(n){
  if (!n.stages.length) return n.body === "pending" ? "본문 정리 대기 중 — 원문에서 확인하세요" : "";
  return n.stages.slice(0, 3).map(s => `${esc(s.label)} · ${per(s.period)}${s.place ? " · " + esc(s.place) : ""}`).join("<br>");
}
const loadingBox = t => `<div class="loading">${t || "불러오는 중… (서버가 쉬고 있으면 첫 화면이 50초까지 걸려요)"}</div>`;
const fail = e => `<div class="empty">불러오지 못했어요 (${esc(e)}). 잠시 후 새로고침해 주세요.</div>`;

// ── 라우터 ───────────────────────────────────────────
const ROUTES = {"": home, settings, notice, graph, top: popularPage, lib};
async function route(){
  const r = (location.hash.replace(/^#\/?/, "").split("?")[0]) || "";
  document.body.classList.toggle("home", r === "");
  document.querySelectorAll(".menu a").forEach(a => a.classList.toggle("on", a.dataset.r === r));
  const p = prof();
  $("#avatar").textContent = p.dept ? deptName(p.dept).slice(0, 1) : "설";
  if (!p.dept && r !== "" && r !== "settings") { location.hash = "#/settings"; return; }
  window.scrollTo(0, 0);
  try { await (ROUTES[r] || home)(); } catch (e) { $("#app").innerHTML = `<main>${fail(e)}</main>`; }
}
window.addEventListener("hashchange", route);

// ── 01 홈 ───────────────────────────────────────────
async function home(){
  const p = prof();
  const flakes = Array.from({length: 22}, (_, i) => [(i*37+11)%96, (i*53+7)%88, i]).filter(([x, y]) => !(x > 22 && x < 78 && y > 28 && y < 74)).slice(0, 14)
    .map(([x, y, i]) => `<span class="flake" style="left:${x}%;top:${y}%;opacity:${.35+(i%4)*.15}">✻</span>`).join("");
  $("#app").innerHTML = `<section class="hero">${flakes}
    <h1 class="big" style="margin:0"><img src="/web/logo.png" alt="snowtice" style="height:84px;width:auto"></h1>
    <p>흩어진 교내 공지를 하나로 모아, 나에게 필요한 소식을 먼저 알려 드려요</p>
    <a class="cta" href="${SNOWCHAT_URL}" target="_blank" rel="noopener">💬 SNOWCHAT 공지비서에게 물어보기 ↗</a>
    <div class="pill">🕛 다음 알림: 내일 12:00</div>
    <div class="quick" id="quick">${p.dept ? "" : '<a href="#/settings">👉 먼저 <b>관심사·학적</b>을 설정하면 내 일정이 보여요</a>'}</div>
  </section><div class="foot">공지 원문은 각 게시판에 있어요 · 날짜·대상은 원문 근거 문장과 대조해 보여 드려요 · 확실하지 않은 값은 '확인 필요'로 표시해요</div>`;
  if (!p.dept) return;
  const [t, d] = await Promise.all([api("/todo", {...pq(), term: TERM}), api("/deadlines", {days: 7, dept: p.dept})]);
  $("#quick").innerHTML = `<a href="#/notice">${esc(t.dept.name)} 졸업 · 남은 단계 <b>${t.items.length}개</b></a>
    <a href="#/lib">7일 안 마감 <b>${d.items.length}개</b></a><a href="#/graph">관심사 그래프 보기 →</a>`;
}

// ── 03 관심사·알림 설정 ─────────────────────────────
async function settings(){
  const p = prof();
  const opts = DEPTS.map(d => `<option value="${d.code}" ${d.code === p.dept ? "selected" : ""}>${esc(d.name)}${d.has_dept_schedule ? "" : " (본부 일정만)"}</option>`).join("");
  const chip = (on, t, dis) => `<button class="chip ${on ? "on" : ""}" ${dis ? "disabled title='다음 단계에서 수집 예정'" : ""}>${on ? "✓ " : ""}${t}${dis ? "<small>준비 중</small>" : ""}</button>`;
  $("#app").innerHTML = `<main><h1 class="pg">관심사·알림 설정</h1><p class="pg-sub">학번·이름은 받지 않아요. 이 브라우저에만 저장돼요.</p>
  <div class="set"><div>
    <div class="card pad sec"><h3>① 관심 분야 <small>지금은 졸업 분야만 수집 중이에요</small></h3>
      <div class="grp">취업·프로그램</div><div class="row">${chip(0,"진로·취업",1)}${chip(0,"비교과·특강",1)}${chip(0,"공모전·대외활동",1)}</div>
      <div class="grp">졸업</div><div class="row">${chip(1,"졸업 요건·심사")}${chip(0,"졸업시험·논문",1)}</div>
      <div class="grp">학사·교무</div><div class="row">${chip(0,"수강신청",1)}${chip(0,"휴학·복학",1)}${chip(0,"성적·학적",1)}</div>
      <div class="grp">장학·등록</div><div class="row">${chip(0,"교내 장학",1)}${chip(0,"교외 장학",1)}${chip(0,"등록금",1)}</div>
    </div>
    <div class="card pad sec" style="margin-top:16px"><h3>② 내 학적 정보</h3>
      <div class="form">
        <div><label>학과(전공)</label><select id="f-dept"><option value="">선택</option>${opts}</select></div>
        <div><label>학적 상태</label><div class="seg" id="f-st">${["재학","휴학","수료"].map(s => `<button class="chip ${s === p.st ? "on" : ""}" data-v="${s}">${s}</button>`).join("")}</div></div>

// 주제 묶음: 절차(그룹)마다 원형으로 모으고, 그룹들은 격자로 배치 (겹치지 않게 고정 배치)
function groupPositions(nodes){
  const groups = {};
  nodes.forEach(n => { const g = (n.group && n.id !== n.group) ? n.group : "_etc"; (groups[g] = groups[g] || []).push(n); });
  const keys = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length);
  const cols = Math.ceil(Math.sqrt(keys.length)), pos = {}, cell = 380;
  keys.forEach((k, gi) => {
    const L = groups[k].sort((a, b) => b.score - a.score), cx = (gi % cols) * cell, cy0 = Math.floor(gi / cols) * cell;
    L.forEach((n, i) => {
      if (i === 0) { pos[n.id] = {x: cx, y: cy0}; return; }
      const ring = i <= 8 ? 1 : 2, idx = ring === 1 ? i - 1 : i - 9, cnt = ring === 1 ? Math.min(8, L.length - 1) : L.length - 9;
      const ang = (2 * Math.PI * idx) / Math.max(cnt, 1), rad = ring * 95;
      pos[n.id] = {x: cx + rad * Math.cos(ang), y: cy0 + rad * Math.sin(ang)};
    });
  });
  return pos;
}
async function selectNode(n, seedId){

  const T = {Stage: "단계", Notice: "공지", Caution: "유의사항", Procedure: "절차", Dept: "학과", Office: "부서", Interest: "관심사"}[n.type] || n.type;
  let url = n.url, noticeId = n.type === "Notice" ? n.id : null;
  if (n.type === "Stage") { try { const s = await api("/stage/" + n.id); const src = s.sources[0]; if (src) { url = src.url; noticeId = src.notice_id; } } catch {} }
  const isSaved = noticeId && saved().includes(noticeId);
  $("#sel").innerHTML = `<div class="card pad selcard"><div style="font-size:12px;color:var(--sub)">선택한 노드 · ${T}${n.status ? " · " + esc(n.status) : ""}</div>
    <h3 style="margin:6px 0 4px;font-size:17px">${esc(n.label)}</h3>
    <dl class="dl">${n.period ? `<dt>일시</dt><dd>${per(n.period)}</dd>` : ""}${n.place ? `<dt>장소</dt><dd>${esc(n.place)}</dd>` : ""}
      ${n.target ? `<dt>대상</dt><dd>${esc(n.target)}</dd>` : ""}${n.posted ? `<dt>게시일</dt><dd>${esc(n.posted)}</dd>` : ""}${n.group_label ? `<dt>절차</dt><dd>${esc(n.group_label)}</dd>` : ""}</dl>
    ${n.why ? `<div class="path"><b>추천 경로</b>${esc(n.why)}</div>` : ""}
    ${url ? `<a class="btn btn-p" style="display:block;text-align:center;text-decoration:none" href="${esc(url)}" target="_blank" rel="noopener">원문 보기 ↗</a>` : ""}
    ${noticeId ? `<button class="btn ${isSaved ? "btn-y" : ""}" style="width:100%;margin-top:8px" data-save="${esc(noticeId)}">${isSaved ? "★ 저장됨" : "☆ 저장"}</button>` : ""}</div>`;
  bindSave($("#sel"));
}

// ── 06 인기 게시글 ──────────────────────────────────
async function popularPage(){
  const p = prof();
  $("#app").innerHTML = `<main><h1 class="pg">인기 게시글</h1><p class="pg-sub">학교 게시판에서 조회수가 높은 공지를 순서대로 보여줘요. 조회수는 중요도가 아닌 참고 지표예요.</p>
    <div class="row" style="margin-bottom:14px"><button class="chip" disabled>행사·프로그램<small>준비 중</small></button><button class="chip on">졸업</button><button class="chip" disabled>학사·교무<small>준비 중</small></button><button class="chip" disabled>장학·등록<small>준비 중</small></button></div>
    <div class="top2"><div class="card" id="rk">${loadingBox()}</div>
    <div class="card pad"><h3 style="margin:0 0 6px;font-size:15px">이렇게 계산합니다</h3><ul class="how">
      <li>2026-2 졸업 공지 중 수집 시점의 누적 조회수로 줄을 세워요.</li><li>여러 학과에 다시 올라온 같은 공지는 하나로 묶어요(대표 공지 기준).</li>
      <li>내 학과·학적에 맞으면 '해당', 판단할 정보가 없으면 '확인 필요'예요.</li><li>조회수는 매일 새벽 공지를 다시 수집할 때 갱신돼요.</li></ul></div></div></main>`;
  const r = await api("/popular", {limit: 15, term: TERM, dept: p.dept});
  const mx = Math.max(...r.map(x => x.hits), 1);
  $("#rk").innerHTML = r.map((n, i) => { const sv = saved().includes(n.notice_id);
    return `<div class="rk"><div class="n ${i > 2 ? "lo" : ""}">${i + 1}</div><div><div class="row"><a href="${esc(n.url)}" target="_blank" rel="noopener" style="font-weight:700;text-decoration:none">${esc(n.title)}</a> ${badges(n)}</div>
      <div style="font-size:12px;color:var(--sub);margin-top:3px">${esc(n.board)} · ${esc(n.posted)}${n.next ? " · 다음: " + esc(n.next.label) + " " + esc(n.next.period) : ""}</div>
      <div class="bar"><i style="width:${(n.hits / mx * 100).toFixed(1)}%"></i></div></div>
      <div class="row" style="flex-wrap:nowrap"><span style="font-weight:700">조회 ${n.hits.toLocaleString()}</span> ${fitBd(n.fit)} <button class="btn ${sv ? "btn-y" : ""}" data-save="${esc(n.notice_id)}">${sv ? "★ 저장됨" : "☆ 저장"}</button></div></div>`; }).join("")
    + `<div style="padding:12px 18px;font-size:12px;color:var(--mute)">${ymd(today())} 수집 시점 누적 조회수</div>`;
  bindSave($("#rk"));
}

// ── 07 내 라이브러리 ────────────────────────────────
async function lib(){
  const ids = saved();
  $("#app").innerHTML = `<main><h1 class="pg">내 라이브러리</h1><p class="pg-sub">저장한 공지와 다가오는 일정을 모아 봐요. 달력에는 내 학과 졸업 일정도 함께 표시돼요.</p>
    <div class="lib"><div><div class="tabs" id="lt"></div><div class="row" style="margin-bottom:12px"><button class="chip on">전체</button><button class="chip" disabled>행사·프로그램<small>준비 중</small></button><button class="chip on" style="pointer-events:none">졸업</button></div><div id="lcards">${loadingBox()}</div></div>
    <div><div class="card cal" id="cal"></div></div></div></main>`;
  const [cards, todo] = await Promise.all([ids.length ? api("/feed", {...pq(), ids: ids.join(",")}) : Promise.resolve([]), api("/todo", {...pq(), term: TERM, include_closed: true})]);
  const live = cards.filter(n => n.next), past = cards.filter(n => !n.next);
  let tab = "진행 중";
  const drawCards = () => {
    $("#lt").innerHTML = [["진행 중", live], ["지난 공지", past]].map(([k, v]) => `<button class="chip ${k === tab ? "on" : ""}" data-k="${k}">${k} <small>${v.length}</small></button>`).join("");
    const L = tab === "진행 중" ? live.sort((a, b) => (a.next.hi || a.next.lo).localeCompare(b.next.hi || b.next.lo)) : past;
    $("#lcards").innerHTML = !ids.length ? `<div class="card pad empty">아직 저장한 공지가 없어요. <a class="link" href="#/notice">공지함</a>이나 <a class="link" href="#/top">인기 게시글</a>에서 ☆를 눌러 저장해 보세요.</div>`
      : L.length ? L.map(n => { const x = n.next, dd = x ? x.d_day : null, lo = x && x.lo && x.lo.slice(0, 10) <= ymd(today());
        return `<div class="card lcard"><div class="dbox ${!x ? "done" : dd > 7 ? "later" : ""}"><small>${!x ? "종료" : x.hi ? "마감까지" : "시작까지"}</small><b>${!x ? "—" : dd === 0 ? "D-DAY" : "D-" + dd}</b></div>
          <div><div class="meta row" style="font-size:12px;color:var(--sub)">${badges(n)} ${fitBd(n.fit)} ${esc(n.board)}</div><div style="font-weight:800;font-size:15px;margin:5px 0">${esc(n.title)}</div>
          <div style="font-size:12.5px;color:var(--sub)">${facts(n)}</div>
          <div class="row" style="margin-top:10px"><a class="btn" href="${esc(n.url)}" target="_blank" rel="noopener" style="text-decoration:none">원문 보기</a><button class="btn" data-unsave="${esc(n.notice_id)}">저장 해제</button></div></div></div>`; }).join("")
      : '<div class="card pad empty">이 목록에 공지가 없어요.</div>';
    $("#lt").onclick = e => { const b = e.target.closest("button"); if (b) { tab = b.dataset.k; drawCards(); } };
    $("#lcards").querySelectorAll("[data-unsave]").forEach(b => b.onclick = () => { toggleSave(b.dataset.unsave); lib(); });
  };
  drawCards();
  // 달력: 저장한 공지의 일정(주황) + 내 학과 졸업 단계(남색)
  const evs = [];
  cards.forEach(n => n.stages.forEach(s => { const d = (s.hi || s.lo || "").slice(0, 10); if (d) evs.push({d, t: s.label, k: "s", time: (s.hi || s.lo).slice(11, 16)}); }));
  todo.items.forEach(s => { const d = (s.hi || s.lo || "").slice(0, 10); if (d && !evs.some(e => e.d === d && e.t === s.label)) evs.push({d, t: s.label, k: "m", time: (s.hi || s.lo).slice(11, 16)}); });
  let cur = today(); cur = new Date(cur.getFullYear(), cur.getMonth(), 1);
  const drawCal = () => {
    const y = cur.getFullYear(), m = cur.getMonth(), first = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate(), td = ymd(today());
    const cells = Array(first).fill('<div></div>').concat(Array.from({length: days}, (_, i) => { const d = ymd(new Date(y, m, i + 1)), es = evs.filter(e => e.d === d);
      return `<div class="d ${d === td ? "today" : ""}" title="${esc(es.map(e => e.t).join(" / "))}">${i + 1}<span class="ds">${es.slice(0, 3).map(e => `<i class="${e.k}"></i>`).join("")}</span></div>`; }));
    const mon = evs.filter(e => e.d.startsWith(`${y}-${String(m + 1).padStart(2, "0")}`)).sort((a, b) => a.d.localeCompare(b.d));
    $("#cal").innerHTML = `<div class="cal-h"><button id="pm">‹</button>${y}년 ${m + 1}월<button id="nm">›</button></div>
      <div class="cal-g">${["월","화","수","목","금","토","일"].map(w => `<div class="w">${w}</div>`).join("")}${cells.join("")}</div>
      <div class="lg" style="gap:12px;margin:10px 0"><span><span class="dot" style="background:var(--org)"></span> 저장한 공지</span><span><span class="dot" style="background:var(--navy2)"></span> 내 졸업 일정</span></div>
      <div style="font-size:12px;color:var(--sub);font-weight:700;margin:6px 0">이번 달 일정</div>
      ${mon.length ? mon.map(e => `<div class="ev"><span class="dot" style="background:${e.k === "s" ? "var(--org)" : "var(--navy2)"};margin-top:4px"></span><span>${+e.d.slice(5, 7)}/${+e.d.slice(8)}${e.time ? " " + e.time : ""}</span><span>${esc(e.t)}</span></div>`).join("") : '<div class="empty" style="padding:8px 0">이 달 일정 없음</div>'}`;
    $("#pm").onclick = () => { cur.setMonth(cur.getMonth() - 1); drawCal(); }; $("#nm").onclick = () => { cur.setMonth(cur.getMonth() + 1); drawCal(); };
  };
  drawCal();
}

// ── 시작 ────────────────────────────────────────────
(async () => {
  try { DEPTS = (await api("/depts")).sort((a, b) => (b.has_dept_schedule - a.has_dept_schedule) || a.name.localeCompare(b.name, "ko")); }
  catch (e) { $("#app").innerHTML = `<main>${fail(e)}</main>`; return; }
  const q = new URLSearchParams(location.search).get("dept");
  if (q && DEPTS.some(d => d.code === q)) ls.set("sigma.profile", {...prof(), dept: q});
  route();
})();
</script>
